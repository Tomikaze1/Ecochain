<ion-content class="ion-padding" *ngIf="trip">
  <h2>Latest Trip Summary</h2>

  <ion-card>
    <ion-card-content>
      <p><strong>Date:</strong> {{ trip.date | date:'short' }}</p>
      <p><strong>Distance:</strong> {{ trip.distance }} km</p>
      <p><strong>Fuel:</strong> {{ trip.fuel }}</p>
      <p><strong>CO₂ Emitted:</strong> {{ trip.emissions }} kg</p>
      <p><strong>Fuel Cost:</strong> ₱{{ fuelCost.toFixed(2) }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
