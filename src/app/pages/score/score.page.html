<ion-content class="ion-padding">
  <h2>Your Eco Score</h2>

  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ emoji }} {{ rating }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Total Distance:</strong> {{ totalDistance }} km</p>
      <p><strong>Total Emissions:</strong> {{ totalEmissions.toFixed(2) }} kg</p>
      <p><strong>Efficiency:</strong> {{ efficiency.toFixed(2) }} kg/km</p>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" routerLink="/trip-entry">Log New Trip</ion-button>
</ion-content>
