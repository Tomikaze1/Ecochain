<ion-content class="ion-padding">
  <h2>Vehicle & Fuel Settings</h2>

  <ion-item>
    <ion-label>Vehicle Type</ion-label>
    <ion-select [(ngModel)]="selectedVehicle">
      <ion-select-option *ngFor="let v of vehicleTypes" [value]="v">{{ v }}</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-label>Fuel Type</ion-label>
    <ion-select [(ngModel)]="selectedFuel" (ionChange)="onFuelChange()">
      <ion-select-option *ngFor="let f of fuelTypes" [value]="f">{{ f }}</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Fuel Price (₱)</ion-label>
    <ion-input type="number" [(ngModel)]="fuelPrice"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Dark Mode</ion-label>
    <ion-toggle (ionChange)="toggleDark($event)"></ion-toggle>
  </ion-item>
  
  <ion-button expand="block" (click)="saveSettings()">Save Settings</ion-button>
</ion-content>
