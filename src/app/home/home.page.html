<ion-content class="ion-padding">
  <h2>Welcome, {{ username }}</h2>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Latest Trip</ion-card-title>
    </ion-card-header>
    <ion-card-content *ngIf="recentTrip">
      <p><strong>Distance:</strong> {{ recentTrip.distance }} km</p>
      <p><strong>CO₂:</strong> {{ recentTrip.emissions }} kg</p>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Total Emissions</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Sum:</strong> {{ totalEmissions.toFixed(2) }} kg CO₂</p>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" routerLink="/trip-entry">Log a New Trip</ion-button>
</ion-content>
